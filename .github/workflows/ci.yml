name: Belnet Static Focal

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-focal:
    name: Static (Focal AMD64)
    runs-on: ubuntu-20.04

    env:
      DEBIAN_FRONTEND: noninteractive
      LOCAL_MIRROR: https://beldex.rocks/deps

    steps:
      # --------------------------------------------------------
      # Checkout source
      # --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            eatmydata \
            g++-10 \
            python3-dev \
            automake \
            libtool \
            gdb \
            cmake \
            git \
            pkg-config \
            ccache \
            make

      # --------------------------------------------------------
      # Configure GCC 10
      # --------------------------------------------------------
      - name: Configure GCC 10
        run: |
          gcc-10 --version
          g++-10 --version

          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-10 100

          sudo update-alternatives \
            --install /usr/bin/g++ g++ /usr/bin/g++-10 100

      # --------------------------------------------------------
      # Configure static build
      # --------------------------------------------------------
      - name: Configure static build
        run: |
          cmake -S . -B build \
            -DWITH_SETCAP=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_LTO=ON \
            -DWITH_TESTS=OFF \
            -DBUILD_STATIC_DEPS=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DSTATIC_LINK=ON \
            -DCMAKE_C_COMPILER=gcc-10 \
            -DCMAKE_CXX_COMPILER=g++-10 \
            -DCMAKE_CXX_FLAGS="-march=x86-64 -mtune=haswell" \
            -DCMAKE_C_FLAGS="-march=x86-64 -mtune=haswell" \
            -DNATIVE_BUILD=OFF \
            -DWITH_SYSTEMD=OFF \
            -DWITH_BOOTSTRAP=OFF \
            -DBUILD_LIBBELNET=OFF \
            -DLOCAL_MIRROR="${LOCAL_MIRROR}"

      # --------------------------------------------------------
      # Build
      # --------------------------------------------------------
      - name: Build
        run: |
          VERBOSE=1 make -C build -j"$(nproc)"

      # --------------------------------------------------------
      # Check static libraries
      # --------------------------------------------------------
      - name: Check static libraries
        run: |
          ./contrib/ci/drone-check-static-libs.sh

      # --------------------------------------------------------
      # Prepare build files
      # --------------------------------------------------------
      - name: Prepare release
        run: |
          mkdir -p release

          find build -type f -executable \
            -exec cp -v {} release/ \;

          echo "Files to upload:"
          ls -lah release

      # --------------------------------------------------------
      # Configure SSH
      # --------------------------------------------------------
      - name: Configure SSH
        if: github.event_name != 'pull_request'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 644 ~/.ssh/known_hosts

      # --------------------------------------------------------
      # Upload to server
      # --------------------------------------------------------
      - name: Upload build
        if: github.event_name != 'pull_request'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PATH: ${{ secrets.SSH_PATH }}
        run: |
          set -e

          echo "Creating remote directory..."

          ssh \
            -p "${SSH_PORT}" \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${SSH_PATH}'"

          echo "Uploading build..."

          scp \
            -P "${SSH_PORT}" \
            release/* \
            "${SSH_USER}@${SSH_HOST}:${SSH_PATH}/"

          echo "Build uploaded successfully."
